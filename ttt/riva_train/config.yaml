# Fine-tune Riva-Translate on Uzbek <-> Russian (train.py).
# Relative paths are taken from this folder (ttt/riva_train/). Override any key: --set train.lr=5e-6

model: nvidia/Riva-Translate-4B-Instruct-v2

data:
  train: /data/datasets/ttt/uz-ru/train.jsonl
  dev: /data/datasets/ttt/uz-ru/dev.jsonl
  test: /data/datasets/ttt/uz-ru/test.jsonl   # only used to drop train rows that also appear in test
  pairs: [uz-ru, ru-uz]                       # directions to train on
  max_len: 384                                # tokens per example (prompt + translation); longer is cut
  max_train_rows: null                        # e.g. 100000 for a quick run (null = all)
  dev_samples: 2000                           # dev rows used for eval loss

train:
  epochs: 2
  lr: 1.0e-5
  scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  batch_size: auto              # per GPU; auto = largest batch that fits (probed with the longest examples)
  memory_fraction: 0.92         # auto batch may use this share of GPU memory (incl. optimizer)
  target_batch: 256             # sentences per optimizer step; grad_accum = target / (batch_size x GPUs), min 1
  grad_checkpointing: false     # true = far less memory but ~30% slower (only if the model barely fits)
  eval_steps: 1000              # eval loss on dev + save checkpoint every N steps
  save_total_limit: 2           # best + latest
  logging_steps: 25
  num_workers: 8                # dataloader processes per GPU
  seed: 42

output:
  dir: /data/experiments/riva   # checkpoint-*/, final/, logs/, config_used.yaml

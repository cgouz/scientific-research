# Seq2seq NMT uz -> ru (train_nmt.py). Keys here override DEFAULTS in the script; --set overrides this file.
#   python train_nmt.py --config configs/nmt_uz_ru.yaml

model:
  name: nllb-600m                # nllb-600m | nllb-1.3b | nllb-3.3b | madlad-3b | <HF id> (+ type)

data:
  pair: uz-ru
  root: /data                    # relative paths below are taken from here
  manifests:
    - name: til_uz-ru
      train: til_uz-ru/train.jsonl
      dev: til_uz-ru/dev.jsonl
      test: til_uz-ru/test.jsonl
    - name: uzlpc
      train: uzlpc/train.jsonl
      dev: uzlpc/dev.jsonl
      test: uzlpc/test.jsonl
  dirs: []                       # or: folders holding train.jsonl / dev.jsonl / test.jsonl
  max_per_source: null
  max_len: 256
  eval_samples: 500
  test_samples: 2000

train:
  epochs: 1.0
  lr: 5.0e-5
  batch_size: auto
  target_batch: 256

output:
  dir: outputs/nmt-uz-ru                # relative = inside this ttt/ folder
